name: CI
on:
  push: { branches: [main, develop] }
  pull_request: { branches: [main, develop] }

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: fortune, POSTGRES_PASSWORD: fortune, POSTGRES_DB: fortune_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fortune" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://fortune:fortune@localhost:5432/fortune_test?schema=public
      REDIS_HOST: localhost
      NODE_ENV: test
      TELEGRAM_BOT_TOKEN: "7654321:AAF-ci-test-token" # e2e Telegram login (Sprint 04)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx --workspace apps/api prisma validate
      # prisma format must be a no-op on a committed schema
      - run: npx --workspace apps/api prisma format && git diff --exit-code apps/api/prisma/schema.prisma
      - run: npm --workspace apps/api run prisma:generate
      - run: npx --workspace apps/api prisma migrate deploy
      # Sprint 04B: migrations replayed onto a REAL empty shadow database must
      # reproduce schema.prisma exactly (exit code 0 = no drift).
      - run: PGPASSWORD=fortune psql -h localhost -U fortune -d fortune_test -c 'CREATE DATABASE fortune_shadow'
      # Paths are relative to apps/api because `npx --workspace apps/api`
      # runs with the workspace directory as cwd (same reason the plain
      # `prisma validate` / `migrate deploy` steps above need no paths).
      - run: >-
          npx --workspace apps/api prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "postgresql://fortune:fortune@localhost:5432/fortune_shadow"
          --exit-code
      - run: npm run api:format:check
      - run: npm run api:lint
      - run: npm run api:test
      - run: npm run api:e2e
      - run: npm run api:build

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: cd apps/mobile && flutter pub get
      # Format gate runs BEFORE gen-l10n: it must judge committed sources
      # only, not the generated app_localizations*.dart (which gen-l10n
      # emits into lib/l10n with its own generator formatting).
      - name: Format (prints exact drift on failure)
        run: |
          cd apps/mobile && dart format .
          git -C ../.. diff --exit-code -- apps/mobile
      - run: cd apps/mobile && flutter gen-l10n
      - run: cd apps/mobile && flutter analyze
      - run: cd apps/mobile && flutter test
      # Sprint 05: the Telegram Mini App ships as a web build. Compiling it here
      # validates the js_interop bridge and the web/ target (analyze/test alone
      # run on the VM and never exercise the web-only implementation).
      - run: cd apps/mobile && flutter build web --release

  # Play build (Sprint Android): the production flavor with guest login and
  # native bridges on. The AAB is what Mike uploads to Play Console; the APK
  # installs directly on a phone for pre-Play testing. Both come out of the
  # run's Artifacts. Release signing appears only when the ANDROID_KEYSTORE_*
  # secrets exist; until then the bundle is debug-signed and CI stays green.
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: cd apps/mobile && flutter pub get
      - run: cd apps/mobile && flutter gen-l10n
      - name: Materialize release signing from secrets
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        working-directory: apps/mobile/android
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          {
            echo "storeFile=../upload-keystore.jks"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=upload"
          } > key.properties
      - name: Build Play bundle (production flavor)
        working-directory: apps/mobile
        run: >
          flutter build appbundle --release
          -t lib/main_production.dart
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://fortune-app-sprint04-production.up.railway.app/api/v1' }}
          --dart-define=TELEGRAM_BOT_USERNAME=${{ vars.TELEGRAM_BOT_USERNAME || 'bakhtnegarbot' }}
          --dart-define=ENABLE_GUEST_AUTH=true
          --dart-define=ENABLE_ANDROID_BRIDGES=true
      - name: Build installable APK (same flavor)
        working-directory: apps/mobile
        run: >
          flutter build apk --release
          -t lib/main_production.dart
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://fortune-app-sprint04-production.up.railway.app/api/v1' }}
          --dart-define=TELEGRAM_BOT_USERNAME=${{ vars.TELEGRAM_BOT_USERNAME || 'bakhtnegarbot' }}
          --dart-define=ENABLE_GUEST_AUTH=true
          --dart-define=ENABLE_ANDROID_BRIDGES=true
      - uses: actions/upload-artifact@v4
        with:
          name: bakhtnegar-android
          path: |
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
