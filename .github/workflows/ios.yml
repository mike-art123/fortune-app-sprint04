# iOS (Strategy A: v1 without ads). Its own workflow — ci.yml and
# deploy-pages.yml are intentionally untouched.
#
# iOS cannot be built on Windows, so like the Android job everything runs in
# CI, here on GitHub's macOS runner. apps/mobile/ios is committed (generated
# once by `flutter create` on this runner, then customized: bundle id
# com.bakhtnegar.app, display name «بخت‌نگار», Persian camera/photo
# permission strings for the coffee ritual).
#
# This phase builds UNSIGNED — it proves the app compiles for a device.
# Code signing and the TestFlight upload arrive next, once the App Store
# Connect API key exists in GitHub Secrets (never in git).
name: iOS

on:
  push: { branches: [main] }
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: cd apps/mobile && flutter pub get
      - run: cd apps/mobile && flutter gen-l10n
      # Same defines as the Android Play job, with two deliberate differences:
      # ENABLE_MONETIZATION=false (v1 ships with no ads — Strategy A) and the
      # unsigned build (signing needs the ASC key). ENABLE_ANDROID_BRIDGES
      # turns on the shared native io paths (share_plus / url_launcher /
      # image_picker), all of which support iOS as-is.
      - name: Build iOS (release, unsigned)
        working-directory: apps/mobile
        run: >
          flutter build ios --release --no-codesign
          -t lib/main_production.dart
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://fortune-app-sprint04-production.up.railway.app/api/v1' }}
          --dart-define=TELEGRAM_BOT_USERNAME=${{ vars.TELEGRAM_BOT_USERNAME || 'bakhtnegarbot' }}
          --dart-define=ENABLE_GUEST_AUTH=true
          --dart-define=ENABLE_ANDROID_BRIDGES=true
          --dart-define=ENABLE_MONETIZATION=false
      # Proof the shipped identity is what we think it is: the built app's
      # Info.plist must carry the App Store bundle id and both permission
      # strings. Cheap, and it fails loudly if a future edit drops one.
      - name: Verify built app identity
        working-directory: apps/mobile
        run: |
          PLIST=build/ios/iphoneos/Runner.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :NSPhotoLibraryUsageDescription' "$PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" = "com.bakhtnegar.app"
