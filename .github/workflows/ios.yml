# iOS (Strategy A: v1 without ads). Its own workflow — ci.yml and
# deploy-pages.yml are intentionally untouched.
#
# iOS cannot be built on Windows, so like the Android job everything runs in
# CI, here on GitHub's macOS runner. apps/mobile/ios is committed (generated
# once by `flutter create` on this runner, then customized: bundle id
# com.bakhtnegar.app, display name «بخت‌نگار», Persian camera/photo
# permission strings for the coffee ritual).
#
# Two paths, chosen by whether the App Store Connect secrets exist — the same
# shape the Android job uses for its keystore, so CI stays green before the
# credentials arrive:
#
#   secrets absent  → build UNSIGNED. Proves the app compiles for a device
#                     and that its shipped identity is what we intend.
#   secrets present → archive with Xcode CLOUD SIGNING and upload to
#                     TestFlight. No .p12 and no Mac are needed: with an
#                     App Store Connect *team* API key (Admin access) and
#                     -allowProvisioningUpdates, xcodebuild creates and uses
#                     a cloud-managed distribution certificate on the runner.
#
# Secrets consumed (set in repo Settings → Secrets and variables → Actions):
#   APP_STORE_CONNECT_KEY_ID          the KEYID from AuthKey_<KEYID>.p8
#   APP_STORE_CONNECT_ISSUER_ID       the issuer UUID shown above the key list
#   APP_STORE_CONNECT_KEY_P8          the .p8 file: paste its text as-is,
#                                     or base64 — the job accepts either
#   APPLE_TEAM_ID                     10-character team id
# The key is written to disk only inside the runner and never printed.
name: iOS

on:
  push: { branches: [main] }
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Same defines as the Android Play job, with one deliberate difference:
      # ENABLE_MONETIZATION=false — v1 ships with no ads (Strategy A).
      # ENABLE_ANDROID_BRIDGES turns on the shared native io paths
      # (share_plus / url_launcher / image_picker), all of which carry iOS.
      DART_DEFINES: >-
        --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://fortune-app-sprint04-production.up.railway.app/api/v1' }}
        --dart-define=TELEGRAM_BOT_USERNAME=${{ vars.TELEGRAM_BOT_USERNAME || 'bakhtnegarbot' }}
        --dart-define=ENABLE_GUEST_AUTH=true
        --dart-define=ENABLE_ANDROID_BRIDGES=true
        --dart-define=ENABLE_MONETIZATION=false
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: cd apps/mobile && flutter pub get
      - run: cd apps/mobile && flutter gen-l10n

      # TestFlight rejects a build number it has already seen for a given
      # version string, so the run number drives CFBundleVersion. It only ever
      # increases, which is the one property TestFlight asks of it.
      - name: Decide which path this run takes
        id: signing
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] \
             && [ -n "$ASC_KEY_P8" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "App Store Connect credentials found — archiving and uploading to TestFlight."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No App Store Connect credentials yet — building unsigned only."
          fi

      # ---------- unsigned path (before the credentials exist) ----------

      - name: Build iOS (release, unsigned)
        if: steps.signing.outputs.ready != 'true'
        working-directory: apps/mobile
        run: >
          flutter build ios --release --no-codesign
          -t lib/main_production.dart
          --build-number=${{ github.run_number }}
          $DART_DEFINES

      - name: Verify built app identity
        if: steps.signing.outputs.ready != 'true'
        working-directory: apps/mobile
        run: bash ../../.github/scripts/verify-ios-identity.sh build/ios/iphoneos/Runner.app/Info.plist

      # ---------- signed path (archive + TestFlight) ----------

      # The secret may hold the .p8 either verbatim (open it in Notepad,
      # select all, paste — no tooling needed) or base64-encoded. Both are
      # accepted so the easy path is available without being the only one.
      - name: Install the App Store Connect key
        if: steps.signing.outputs.ready == 'true'
        run: |
          mkdir -p ~/private_keys
          KEYFILE=~/private_keys/AuthKey_"$ASC_KEY_ID".p8
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            echo "Key pasted verbatim."
            printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$KEYFILE"
          else
            echo "Key pasted base64-encoded."
            printf '%s' "$ASC_KEY_P8" | tr -d '\r\n ' | base64 --decode -o "$KEYFILE"
          fi
          chmod 600 "$KEYFILE"
          # Shape only — never the contents. A wrong paste fails here with a
          # sentence Mike can act on, instead of an opaque xcodebuild error.
          if ! grep -q 'BEGIN PRIVATE KEY' "$KEYFILE"; then
            echo "::error::APP_STORE_CONNECT_KEY_P8 is not a readable .p8 key. Re-copy the whole file, including the BEGIN and END lines."
            exit 1
          fi
          echo "Key installed, $(wc -c < "$KEYFILE") bytes."

      - name: Configure the Xcode project
        if: steps.signing.outputs.ready == 'true'
        working-directory: apps/mobile
        run: |
          flutter build ios --release --no-codesign --config-only \
            -t lib/main_production.dart \
            --build-number=${{ github.run_number }} \
            $DART_DEFINES
          # --config-only normally runs CocoaPods itself; this is the cheap
          # self-heal if it ever does not.
          [ -d ios/Pods ] || (cd ios && pod install)

      - name: Archive with cloud signing
        if: steps.signing.outputs.ready == 'true'
        working-directory: apps/mobile
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_"$ASC_KEY_ID".p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Verify archived app identity
        if: steps.signing.outputs.ready == 'true'
        run: |
          bash .github/scripts/verify-ios-identity.sh \
            "$RUNNER_TEMP/Runner.xcarchive/Products/Applications/Runner.app/Info.plist"

      - name: Export and upload to TestFlight
        if: steps.signing.outputs.ready == 'true'
        working-directory: apps/mobile
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_"$ASC_KEY_ID".p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the key from the runner
        if: always() && steps.signing.outputs.ready == 'true'
        run: rm -rf ~/private_keys
