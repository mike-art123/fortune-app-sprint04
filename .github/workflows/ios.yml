# iOS (Strategy A: v1 without ads). Its own workflow — ci.yml and
# deploy-pages.yml are intentionally untouched.
#
# iOS cannot be built on Windows, so like the Android job everything runs in
# CI, here on GitHub's macOS runner. apps/mobile/ios is committed (generated
# once by `flutter create` on this runner, then customized: bundle id
# com.bakhtnegar.app, display name «بخت‌نگار», Persian camera/photo
# permission strings for the coffee ritual).
#
# ── Why the signing looks the way it does ────────────────────────────────
# Apple's automatic signing ALWAYS signs an archive for *development* and
# only converts it to distribution at export — WWDC21 "Distribute apps in
# Xcode with cloud signing": "Xcode will take the developer-signed app in
# your archive and generate a partial signature for it." Development
# profiles require a registered device; this team owns none, and a CI runner
# never will. So automatic signing can never archive here, no matter which
# flags or identities are passed.
#
# The route that does work on a device-less machine is MANUAL distribution
# signing: an App Store provisioning profile needs no device at all. The
# App Store Connect API key mints the distribution certificate and the App
# Store profile, both are installed into a throwaway keychain, and the
# project is pointed at them before the build.
#
# Two things learned the hard way, kept here so they are not repeated:
#   * Never pass CODE_SIGN_IDENTITY/CODE_SIGN_STYLE as xcodebuild
#     command-line settings — they hit EVERY target in the workspace,
#     including the Pods and SPM package targets that ship
#     CODE_SIGN_STYLE = Automatic, and every one of them then fails with
#     "has conflicting provisioning settings".
#   * Never archive with CODE_SIGNING_ALLOWED=NO hoping export will sign.
#     It strips the Google framework signatures and replaces them with
#     ad-hoc ones; App Store Connect rejects the upload with "not properly
#     signed … not an ad hoc certificate".
#
# Secrets consumed (Settings → Secrets and variables → Actions):
#   APP_STORE_CONNECT_KEY_ID          the KEYID from AuthKey_<KEYID>.p8
#   APP_STORE_CONNECT_ISSUER_ID       the issuer UUID above the key list
#   APP_STORE_CONNECT_KEY_P8          the .p8 file, pasted as-is or base64
#   APPLE_TEAM_ID                     10-character team id
# The certificate's own private key is generated on the runner each run and
# dies with it, so there is nothing further for Mike to store or protect.
name: iOS

on:
  push: { branches: [main] }
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_ID: com.bakhtnegar.app
      # Same defines as the Android Play job, with two deliberate differences:
      # ENABLE_MONETIZATION=false — v1 ships with no ads (Strategy A) — and
      # ENABLE_SOCIAL_LINKS=false, which drops the invite card and the
      # Telegram/Instagram tiles from the first submission. Neither breaks a
      # rule (3.1.1 is about paying outside the app, and nothing here is for
      # sale), but 4.3(b) names fortune telling by name, so the first review
      # gets an app with nothing to buy, no account and nowhere it sends you.
      # ENABLE_ANDROID_BRIDGES turns on the shared native io paths
      # (share_plus / url_launcher / image_picker), all of which carry iOS.
      DART_DEFINES: >-
        --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://fortune-app-sprint04-production.up.railway.app/api/v1' }}
        --dart-define=TELEGRAM_BOT_USERNAME=${{ vars.TELEGRAM_BOT_USERNAME || 'bakhtnegarbot' }}
        --dart-define=ENABLE_GUEST_AUTH=true
        --dart-define=ENABLE_ANDROID_BRIDGES=true
        --dart-define=ENABLE_MONETIZATION=false
        --dart-define=ENABLE_SOCIAL_LINKS=false
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: cd apps/mobile && flutter pub get
      - run: cd apps/mobile && flutter gen-l10n

      # The About screen used to print a constant with nothing behind it —
      # 0.1.0+1 on every platform, while TestFlight showed build 10 — and the
      # same wrong string went out in every request's client-version header.
      # The pair is read here from the two places that actually own it: the
      # version name from pubspec, and the run number that becomes
      # CFBundleVersion three steps below. ci.yml and deploy-pages.yml pass
      # neither define, so web and Android keep compiling the same constants
      # they do today.
      - name: Read the version this build will report
        run: |
          NAME="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' apps/mobile/pubspec.yaml)"
          if [ -z "$NAME" ]; then
            echo "::error::Could not read 'version:' from apps/mobile/pubspec.yaml"
            exit 1
          fi
          echo "APP_VERSION=$NAME" >> "$GITHUB_ENV"
          echo "APP_BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "This build reports $NAME+${{ github.run_number }}"

      - name: Decide which path this run takes
        id: signing
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] \
             && [ -n "$ASC_KEY_P8" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "App Store Connect credentials found — signing and uploading to TestFlight."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No App Store Connect credentials yet — building unsigned only."
          fi

      # ---------- unsigned path (no credentials) ----------

      - name: Build iOS (release, unsigned)
        if: steps.signing.outputs.ready != 'true'
        working-directory: apps/mobile
        run: >
          flutter build ios --release --no-codesign
          -t lib/main_production.dart
          --build-number=${{ github.run_number }}
          $DART_DEFINES
          --dart-define=APP_VERSION=$APP_VERSION
          --dart-define=APP_BUILD_NUMBER=$APP_BUILD_NUMBER

      - name: Verify built app identity
        if: steps.signing.outputs.ready != 'true'
        working-directory: apps/mobile
        run: bash ../../.github/scripts/verify-ios-identity.sh build/ios/iphoneos/Runner.app/Info.plist

      # ---------- signed path (TestFlight) ----------

      # The secret may hold the .p8 verbatim (open it in Notepad, select all,
      # paste) or base64. Both are accepted so the easy path exists.
      - name: Install the App Store Connect key
        if: steps.signing.outputs.ready == 'true'
        run: |
          mkdir -p ~/private_keys
          KEYFILE=~/private_keys/AuthKey_"$ASC_KEY_ID".p8
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            echo "Key pasted verbatim."
            printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$KEYFILE"
          else
            echo "Key pasted base64-encoded."
            printf '%s' "$ASC_KEY_P8" | tr -d '\r\n ' | base64 --decode -o "$KEYFILE"
          fi
          chmod 600 "$KEYFILE"
          # Shape only — never the contents. A wrong paste fails here with a
          # sentence Mike can act on, not an opaque signing error later.
          if ! grep -q 'BEGIN PRIVATE KEY' "$KEYFILE"; then
            echo "::error::APP_STORE_CONNECT_KEY_P8 is not a readable .p8 key. Re-copy the whole file, including the BEGIN and END lines."
            exit 1
          fi
          echo "Key installed, $(wc -c < "$KEYFILE") bytes."

      - name: Install Codemagic CLI tools
        if: steps.signing.outputs.ready == 'true'
        run: pip3 install --break-system-packages codemagic-cli-tools

      # A distribution certificate is bound to a private key. Generating that
      # key here — rather than asking Mike to store one — keeps the number of
      # things he has to guard at exactly one (the .p8). The cost is a new
      # certificate per run, which the cleanup step at the end revokes;
      # Apple caps distribution certificates at three, so they must not pile
      # up.
      - name: Create and install the distribution certificate and profile
        if: steps.signing.outputs.ready == 'true'
        working-directory: apps/mobile
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          ssh-keygen -t rsa -b 2048 -m PEM -f "$RUNNER_TEMP/cert_key" -q -N ""
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat ~/private_keys/AuthKey_"$ASC_KEY_ID".p8)"
          keychain initialize
          set -o pipefail
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key "@file:$RUNNER_TEMP/cert_key" 2>&1 \
            | tee "$RUNNER_TEMP/signing.log"
          # Remember what was created so the cleanup step can remove exactly
          # that, rather than guessing at filters or touching anything else.
          sed -n 's/.*Created Signing Certificate \([A-Z0-9]*\).*/\1/p' \
            "$RUNNER_TEMP/signing.log" | head -1 > "$RUNNER_TEMP/cert_id"
          echo "Certificate created: $(cat "$RUNNER_TEMP/cert_id")"
          keychain add-certificates
          xcode-project use-profiles

      - name: Build the signed ipa
        if: steps.signing.outputs.ready == 'true'
        working-directory: apps/mobile
        run: >
          flutter build ipa --release
          -t lib/main_production.dart
          --build-number=${{ github.run_number }}
          $DART_DEFINES
          --dart-define=APP_VERSION=$APP_VERSION
          --dart-define=APP_BUILD_NUMBER=$APP_BUILD_NUMBER
          --export-options-plist="$HOME/export_options.plist"

      - name: Verify archived app identity
        if: steps.signing.outputs.ready == 'true'
        working-directory: apps/mobile
        run: |
          bash ../../.github/scripts/verify-ios-identity.sh \
            build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Info.plist

      - name: Upload to TestFlight
        if: steps.signing.outputs.ready == 'true'
        working-directory: apps/mobile
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set -o pipefail
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat ~/private_keys/AuthKey_"$ASC_KEY_ID".p8)"
          IPA="$(find build/ios/ipa -name '*.ipa' | head -1)"
          echo "Uploading $(basename "$IPA")"
          # The binary lands in one call and the tool then reads the app back
          # over the API. That read is not part of the delivery, and Apple
          # answering it with a 500 has already turned one green upload red.
          # The transfer's own verdict is what counts.
          if app-store-connect publish --path "$IPA" 2>&1 | tee "$RUNNER_TEMP/publish.log"; then
            echo "Uploaded and published."
          elif grep -q 'UPLOAD SUCCEEDED' "$RUNNER_TEMP/publish.log"; then
            echo "::warning::The binary reached App Store Connect (UPLOAD SUCCEEDED); a follow-up API call failed on Apple's side. Check TestFlight - the build is there."
          else
            echo "::error::The upload itself failed."
            exit 1
          fi

      # Each run mints a certificate whose private key dies with the runner,
      # so yesterday's certificates are unusable by anyone, including us -
      # they are pure clutter against Apple's cap. This deletes the one this
      # run created. Non-fatal on purpose: tidying up must never turn a
      # delivered build red.
      - name: Delete this run's certificate
        if: always() && steps.signing.outputs.ready == 'true'
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        continue-on-error: true
        run: |
          CERT_ID="$(cat "$RUNNER_TEMP/cert_id" 2>/dev/null || true)"
          if [ -z "$CERT_ID" ]; then
            echo "No certificate was created this run; nothing to delete."
            exit 0
          fi
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat ~/private_keys/AuthKey_"$ASC_KEY_ID".p8)"
          echo "Deleting signing certificate $CERT_ID"
          app-store-connect certificates delete "$CERT_ID" --ignore-not-found \
            || app-store-connect certificates delete "$CERT_ID" \
            || { echo "Delete refused; printing the syntax for next time:"; \
                 app-store-connect certificates delete --help; }

      - name: Remove the key from the runner
        if: always() && steps.signing.outputs.ready == 'true'
        run: rm -rf ~/private_keys "$RUNNER_TEMP/cert_key" "$RUNNER_TEMP/cert_key.pub"
