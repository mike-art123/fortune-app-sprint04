<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Fortune — a calm Telegram Mini App for reflective readings.">

  <!-- Telegram Mini Apps must not zoom; lock the viewport. -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Fortune</title>
  <link rel="manifest" href="manifest.json">

  <!-- Telegram WebApp SDK: exposes window.Telegram.WebApp (initData, etc.).
       Loaded before Flutter so the bridge sees it at startup. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Open at full size the instant the Mini App launches: expand to full
       height on every client, and request true edge-to-edge fullscreen on
       clients that support it (Bot API 8.0+). Guarded so older Telegram
       clients — and opening the page outside Telegram — are unaffected. -->
  <script>
    (function () {
      try {
        var wa = window.Telegram && window.Telegram.WebApp;
        if (!wa) return;
        if (typeof wa.expand === 'function') wa.expand();
        if (typeof wa.requestFullscreen === 'function') {
          try { wa.requestFullscreen(); } catch (e) {}
        }
      } catch (e) {}
    })();
  </script>

  <!-- Resolve Telegram's TOP safe-area entirely in JS — where safeAreaInset,
       contentSafeAreaInset, isFullscreen and the iOS user-agent are all
       directly available — and publish a single, ready-to-use
       window.__tgSafeArea.topInset. Flutter just pads its toolbar by that
       number, so the header can never sit under Telegram's Close/More controls.
       Re-published on every safe-area / viewport / fullscreen event and a few
       timed retries (iOS reports late). Outside Telegram inTelegram=false. -->
  <script>
    (function () {
      function num(v) { return (typeof v === 'number' && isFinite(v)) ? v : 0; }
      function envTop() {
        try {
          var el = document.createElement('div');
          el.style.cssText =
            'position:fixed;top:0;left:0;width:0;visibility:hidden;' +
            'pointer-events:none;height:env(safe-area-inset-top,0px);';
          (document.body || document.documentElement).appendChild(el);
          var h = el.getBoundingClientRect().height || 0;
          el.parentNode.removeChild(el);
          return h;
        } catch (e) { return 0; }
      }
      function recompute() {
        try {
          var wa = window.Telegram && window.Telegram.WebApp;
          if (!wa) {
            window.__tgSafeArea = {
              inTelegram: false, topInset: 0, bottom: 0, left: 0, right: 0
            };
            window.dispatchEvent(new Event('tg-safearea'));
            return;
          }
          var s = wa.safeAreaInset || {};
          var c = wa.contentSafeAreaInset || {};
          var full = !!wa.isFullscreen;
          var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent || '');
          var top = num(s.top) + num(c.top);
          if (top > 0) {
            top += 8;                         // real values: breathing room
          } else if (full) {
            var device = envTop() || (isIOS ? 59 : 24);
            top = device + (isIOS ? 44 : 12); // notch + Close/More control row
          } else {
            top = envTop();                   // non-fullscreen: OS notch only
          }
          top = Math.max(0, Math.min(200, top));
          window.__tgSafeArea = {
            inTelegram: true, topInset: top,
            bottom: num(s.bottom), left: num(s.left), right: num(s.right)
          };
          window.dispatchEvent(new Event('tg-safearea'));
        } catch (e) {}
      }
      window.__tgRecomputeSafeArea = recompute;
      try {
        var wa = window.Telegram && window.Telegram.WebApp;
        if (wa && typeof wa.onEvent === 'function') {
          ['safeAreaChanged', 'contentSafeAreaChanged',
           'viewportChanged', 'fullscreenChanged'].forEach(function (ev) {
            wa.onEvent(ev, recompute);
          });
        }
      } catch (e) {}
      recompute();
      // Telegram populates insets / enters fullscreen after launch on iOS.
      [100, 250, 500, 900, 1500, 2500].forEach(function (ms) {
        setTimeout(recompute, ms);
      });
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
