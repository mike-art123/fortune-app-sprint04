<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Fortune — a calm Telegram Mini App for reflective readings.">

  <!-- Telegram Mini Apps must not zoom; lock the viewport. -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>Fortune</title>
  <link rel="manifest" href="manifest.json">

  <!-- Telegram WebApp SDK: exposes window.Telegram.WebApp (initData, etc.).
       Loaded before Flutter so the bridge sees it at startup. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Runs before Flutter boots: signal ready, expand to full height, and
       DISABLE vertical swipes so a downward drag inside the app can never close
       or minimise the Mini App (normal content scrolling and the Telegram Close
       button still work). Then request true edge-to-edge fullscreen where
       supported (Bot API 8.0+). All guarded — older clients and non-Telegram
       browsers are unaffected. Nothing anywhere calls enableVerticalSwipes(). -->
  <script>
    (function () {
      try {
        var wa = window.Telegram && window.Telegram.WebApp;
        if (!wa) return;
        if (typeof wa.ready === 'function') wa.ready();
        if (typeof wa.expand === 'function') wa.expand();
        if (typeof wa.disableVerticalSwipes === 'function') {
          wa.disableVerticalSwipes();
        }
        if (typeof wa.requestFullscreen === 'function') {
          try { wa.requestFullscreen(); window.__tgFsRequested = true; } catch (e) {}
        }
      } catch (e) {}
    })();
  </script>

  <!-- Resolve Telegram's TOP safe-area entirely in JS — where safeAreaInset,
       contentSafeAreaInset, isFullscreen and the iOS user-agent are all
       directly available — and publish a single, ready-to-use
       window.__tgSafeArea.topInset. Flutter just pads its toolbar by that
       number, so the header can never sit under Telegram's Close/More controls.
       Re-published on every safe-area / viewport / fullscreen event and a few
       timed retries (iOS reports late). Outside Telegram inTelegram=false. -->
  <script>
    (function () {
      function num(v) { return (typeof v === 'number' && isFinite(v)) ? v : 0; }
      function envTop() {
        try {
          var el = document.createElement('div');
          el.style.cssText =
            'position:fixed;top:0;left:0;width:0;visibility:hidden;' +
            'pointer-events:none;height:env(safe-area-inset-top,0px);';
          (document.body || document.documentElement).appendChild(el);
          var h = el.getBoundingClientRect().height || 0;
          el.parentNode.removeChild(el);
          return h;
        } catch (e) { return 0; }
      }
      function recompute() {
        try {
          var wa = window.Telegram && window.Telegram.WebApp;
          if (!wa) {
            window.__tgSafeArea = {
              inTelegram: false, topInset: 0, debug: 'no-telegram',
              bottom: 0, left: 0, right: 0
            };
            window.dispatchEvent(new Event('tg-safearea'));
            return;
          }
          var s = wa.safeAreaInset || {};
          var c = wa.contentSafeAreaInset || {};
          var full = !!wa.isFullscreen || !!window.__tgFsRequested;
          var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent || '');
          var top;
          if (full) {
            // Clear the notch AND Telegram's Close/More control row. Telegram
            // under-reports contentTop on some iOS clients (e.g. 26 vs ~44),
            // so floor both parts instead of trusting the raw sum.
            var device = Math.max(num(s.top), envTop(), isIOS ? 47 : 0);
            var control = Math.max(num(c.top), isIOS ? 44 : 12);
            top = device + control + 12;
          } else {
            var base = num(s.top) + num(c.top);
            top = base > 0 ? base : envTop();
          }
          top = Math.max(0, Math.min(200, top));
          var dbg = 'TG fs=' + (full ? 1 : 0) + ' s=' + Math.round(num(s.top)) +
            ' c=' + Math.round(num(c.top)) + ' env=' + Math.round(envTop()) +
            ' -> top=' + Math.round(top);
          window.__tgSafeArea = {
            inTelegram: true, topInset: top, debug: dbg,
            bottom: num(s.bottom), left: num(s.left), right: num(s.right)
          };
          window.dispatchEvent(new Event('tg-safearea'));
        } catch (e) {}
      }
      window.__tgRecomputeSafeArea = recompute;
      try {
        var wa = window.Telegram && window.Telegram.WebApp;
        if (wa && typeof wa.onEvent === 'function') {
          ['safeAreaChanged', 'contentSafeAreaChanged',
           'viewportChanged', 'fullscreenChanged'].forEach(function (ev) {
            wa.onEvent(ev, recompute);
          });
        }
      } catch (e) {}
      recompute();
      // Telegram populates insets / enters fullscreen after launch on iOS.
      [100, 250, 500, 900, 1500, 2500].forEach(function (ms) {
        setTimeout(recompute, ms);
      });
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
